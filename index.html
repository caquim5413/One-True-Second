<!DOCTYPE html>
  <html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>One True Second</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#708461">

    <!-- Para que se vea bien al añadirla a la pantalla de inicio en iPhone -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="One True Second">

    <link rel="stylesheet" href="style.css">
  </head>
  <body>
   
    <div id="toolbar">

      <div id="toolbar-left">

        <label for="jump-date-input" id="calendar-btn" title="Ir a un día">
          📅
        </label>
        <input type="date" id="jump-date-input" class="visually-hidden-input">

        <button id="search-btn" title="Buscar por etiqueta">🔍</button>

      </div>

      <div id="toolbar-title">One True Second</div>

      <div id="toolbar-right">

        <button id="tag-manager-btn" title="Administrar etiquetas">🏷️</button>

        <div id="profile-wrapper">

          <button id="profile-btn" title="Cuenta">
            <span id="profile-placeholder">👤</span>
            <img id="profile-avatar" alt="Tu perfil" style="display:none;">
          </button>

          <div id="profile-menu" style="display:none;">
            <span id="profile-name"></span>
            <button id="export-backup-btn">Descargar copia de seguridad</button>
            <button id="google-logout">Cerrar sesión</button>
          </div>

        </div>

      </div>

    </div>

    <div id="search-panel" style="display:none;">
      <input type="text" id="search-input" list="known-tags-list" placeholder="Buscar por etiqueta, ej: ana">
      <datalist id="known-tags-list"></datalist>
      <div id="search-results"></div>
    </div>

    <div id="tag-manager-panel" style="display:none;">
      <div id="tag-manager-header"><strong>Administrar etiquetas</strong></div>
      <div id="tag-manager-status"></div>
      <div id="tag-manager-list"></div>
    </div>

    <div id="grid-view">
      <div class="grid"></div>
    </div>

    <div id="day-view" style="display: none;">
      <h2 id="day-title"></h2>
      <div id="save-status"></div>

      <div id="day-actions-row">
        <label for="image-input" id="image-input-label">📷 Añadir foto</label>
        <input type="file" id="image-input" accept="image/*" class="visually-hidden-input">
        <button id="back">← Volver</button>
      </div>

      <div id="image-gallery"></div>

      <input type="text" id="day-tags" placeholder="#etiquetas separadas por espacio">
      <div id="tag-chips"></div>

      <textarea id="day-text" placeholder="Escribe aquí..."></textarea>
    </div>

    <!-- Librería para poder generar el .zip de la copia de seguridad -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script src="google.js"></script>
    <script src="script.js"></script>
    <script src="drive.js"></script>

    <!-- Este script va el ÚLTIMO a propósito: así garantizamos que
         google.js, script.js y drive.js ya se han cargado del todo
         antes de que dispare su aviso "onload" -->
    <script src="https://accounts.google.com/gsi/client" async onload="initGoogleClient()"></script>

    <script>
        // Registra el service worker para que la app sea instalable
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("service-worker.js")
                    .catch((err) => console.error("Service worker falló:", err));
            });
        }
    </script>
  </body>
</html>
